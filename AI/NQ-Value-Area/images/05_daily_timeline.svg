<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300" font-family="'Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif"><title>每日流程</title><rect width="940" height="300" fill="#ffffff"/><text x="30.0" y="32.0" font-size="18" fill="#1f2933" text-anchor="start" font-weight="bold">一天的流程（台灣時間，美國夏令；11 月起冬令全部晚 1 小時）</text><line x1="60.0" y1="140.0" x2="900.0" y2="140.0" stroke="#cbd2da" stroke-width="4"/><circle cx="80" cy="140" r="11" fill="#6b7785"/><text x="80.0" y="110.0" font-size="15" fill="#6b7785" text-anchor="middle" font-weight="bold">21:00</text><text x="80.0" y="178.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">看盤前預判</text><text x="80.0" y="200.0" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">方向通常已經</text><text x="80.0" y="218.0" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">看得出來</text><circle cx="240" cy="140" r="11" fill="#1f2933"/><text x="240.0" y="110.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">21:30</text><text x="240.0" y="178.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">開盤決定方向</text><text x="240.0" y="200.0" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">只找多／只找空</text><text x="240.0" y="218.0" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">／今天不做</text><circle cx="400" cy="140" r="11" fill="#2563eb"/><text x="400.0" y="110.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">21:34 起</text><text x="400.0" y="178.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">每 5 分鐘檢查</text><text x="400.0" y="200.0" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">連續 2 根 5分K</text><text x="400.0" y="218.0" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">收回區內</text><circle cx="560" cy="140" r="11" fill="#2563eb"/><text x="560.0" y="110.0" font-size="15" fill="#2563eb" text-anchor="middle" font-weight="bold">訊號後 1 分鐘</text><text x="560.0" y="178.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">進場</text><text x="560.0" y="200.0" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">畫出止損、止盈</text><circle cx="720" cy="140" r="11" fill="#6b7785"/><text x="720.0" y="110.0" font-size="15" fill="#6b7785" text-anchor="middle" font-weight="bold">最晚 23:30</text><text x="720.0" y="178.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">最後可進場</text><text x="720.0" y="200.0" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">21:58–22:02 不進場</text><circle cx="880" cy="140" r="11" fill="#dc2626"/><text x="880.0" y="110.0" font-size="15" fill="#dc2626" text-anchor="middle" font-weight="bold">00:29</text><text x="880.0" y="178.0" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">時間到就出場</text><text x="880.0" y="200.0" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">沒碰到止盈止損</text><text x="880.0" y="218.0" font-size="12" fill="#6b7785" text-anchor="middle" font-weight="normal">就收盤出場</text><text x="30.0" y="280.0" font-size="13" fill="#6b7785" text-anchor="start" font-weight="normal">每天最多一筆；+55 點止盈、−145 點止損；進場後不移動停損。</text></svg>